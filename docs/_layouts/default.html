<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="alternate" type="text/plain" href="{{ '/llms.txt' | relative_url }}" title="LLM documentation">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ site.wordmark_url | default: site.repository_url }}">{{ site.wordmark | default: site.title }}</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Overview</a>
        {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
      </nav>
    </header>
    <main id="main" class="doc-main">
      <article class="prose">
        <p class="eyebrow">{{ site.eyebrow }} · DOCUMENTATION</p>
        {{ content }}
      </article>
    </main>
    <footer class="site-footer">
      <a href="{{ site.repository_url }}">GitHub</a>
      <a href="{{ site.repository_url }}/blob/main/LICENSE">License</a>
      <a href="#main">Back to top</a>
    </footer>
  </div>
</body>
</html>
