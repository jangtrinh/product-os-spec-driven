<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W-01 Saved filters list</title>
<style>
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#222}
.bar{display:flex;gap:12px;align-items:center;padding:14px 20px;background:#fff;border-bottom:1px solid #d9dbe0}
.chip{border:1px solid #b9bcc4;border-radius:6px;padding:6px 12px;background:#fff}
.btn{border-radius:6px;padding:6px 14px;background:#4c5fd5;color:#fff}
.box{margin:20px;padding:20px;background:#fff;border:1px solid #d9dbe0;border-radius:8px}
.row{display:flex;gap:10px;margin-top:10px}
.pill{border-radius:99px;padding:4px 12px;background:#e6e8ee}
.mark{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#fff;align-items:center;justify-content:center;font-size:11px;margin-right:6px}
.dim{color:#777}.modal{width:420px;margin:60px auto;padding:24px;background:#fff;border:1px solid #bbb;border-radius:10px}
</style></head><body><div class="bar"><span class="mark">1</span><span class="chip">Status ▾</span><span class="chip">Owner ▾</span><span class="btn">Save filter</span></div>
<div class="box"><span class="mark">2</span><strong>Saved filters</strong><div class="row"><span class="pill">Open bugs</span><span class="pill">My reviews</span><span class="pill">Needs triage</span></div></div>
<div class="box dim">Results for the selected filter (grey placeholder rows)<div class="row"><div class="chip" style="width:60%">&nbsp;</div></div><div class="row"><div class="chip" style="width:45%">&nbsp;</div></div></div></body></html>
